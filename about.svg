<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurMe" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="540" rx="24" fill="url(#bgGrad)"/>
  <circle cx="1080" cy="60" r="160" fill="url(#glow)" filter="url(#blurMe)"/>
  <rect x="2" y="2" width="1196" height="536" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.6"/>

  <text x="60" y="90" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">About Me</text>
  <line x1="62" y1="108" x2="62" y2="108" stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x2" values="62;280;62" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#cbd5e1">
    <tspan x="60" y="160">Computer Science &amp; Engineering student (4th semester) focused on machine</tspan>
    <tspan x="60" y="194">learning and full-stack web development. I prefer building complete, working</tspan>
    <tspan x="60" y="228">products over isolated experiments. My main project, SkillQuest, is a</tspan>
    <tspan x="60" y="262">full-stack learning platform with a live deployment and a real backend.</tspan>
  </text>

  <line x1="60" y1="300" x2="1140" y2="300" stroke="#334155" stroke-width="1"/>

  <circle cx="70" cy="333" r="6" fill="#38bdf8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
  <text x="95" y="339" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">
    <tspan font-weight="700" fill="#60a5fa">Education: </tspan><tspan fill="#e2e8f0">B.Tech, Computer Science &amp; Engineering (4th semester)</tspan>
  </text>

  <circle cx="70" cy="378" r="6" fill="#38bdf8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <text x="95" y="384" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">
    <tspan font-weight="700" fill="#60a5fa">Focus areas: </tspan><tspan fill="#e2e8f0">Machine Learning, Full-Stack Web Development</tspan>
  </text>

  <circle cx="70" cy="423" r="6" fill="#38bdf8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
  <text x="95" y="429" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">
    <tspan font-weight="700" fill="#60a5fa">Currently seeking: </tspan><tspan fill="#e2e8f0">Research internships, Software Engineering roles</tspan>
  </text>

  <circle cx="70" cy="468" r="6" fill="#38bdf8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
  <text x="95" y="474" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">
    <tspan font-weight="700" fill="#60a5fa">Location: </tspan><tspan fill="#e2e8f0">India</tspan>
  </text>
</svg>
