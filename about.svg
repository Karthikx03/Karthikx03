<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <defs>
    <style>
      .h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 40px; fill: #1f2937; }
      .body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 22px; fill: #374151; }
      .label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #1f2937; }
      .value { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #4b5563; }
      .line { stroke: #9ca3af; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="540" fill="#ffffff" rx="14"/>
  <rect x="1.5" y="1.5" width="1197" height="537" rx="12.5" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="86" class="h1">About Me</text>
  <line x1="62" y1="104" x2="230" y2="104" class="line"/>

  <text class="body">
    <tspan x="60" y="156">Computer Science &amp; Engineering student (5th semester) focused on machine</tspan>
    <tspan x="60" y="190">learning and full-stack web development. I prefer building complete, working</tspan>
    <tspan x="60" y="224">products over isolated experiments. My main project, SkillQuest, is a</tspan>
    <tspan x="60" y="258">full-stack learning platform with a live deployment and a real backend.</tspan>
  </text>

  <line x1="60" y1="296" x2="1140" y2="296" stroke="#e5e7eb" stroke-width="1"/>

  <text x="60" y="338"><tspan class="label">Education: </tspan><tspan class="value">B.Tech, Computer Science &amp; Engineering (5th semester)</tspan></text>
  <text x="60" y="378"><tspan class="label">Focus areas: </tspan><tspan class="value">Machine Learning, Full-Stack Web Development</tspan></text>
  <text x="60" y="418"><tspan class="label">Currently seeking: </tspan><tspan class="value">Research internships, Software Engineering roles</tspan></text>
  <text x="60" y="458"><tspan class="label">Location: </tspan><tspan class="value">India</tspan></text>
</svg>
