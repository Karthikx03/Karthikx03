<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 52px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 22px; fill: #bfdbfe; }
      .cursor { fill: #bfdbfe; animation: blink 1.1s steps(1) infinite; }
      .line { stroke: #3b82f6; stroke-width: 2; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="220" fill="url(#bg)" rx="14"/>
  <text x="600" y="110" text-anchor="middle" class="title">Karthik M<tspan class="cursor">|</tspan></text>
  <line x1="420" y1="140" x2="780" y2="140" class="line">
    <animate attributeName="x2" from="420" to="780" dur="1s" begin="0s" fill="freeze"/>
  </line>
  <text x="600" y="172" text-anchor="middle" class="subtitle">Computer Science &amp; Engineering Student · ML &amp; Web Development</text>
</svg>
