<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#312e81;#1e1b4b" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#5b21b6">
        <animate attributeName="stop-color" values="#5b21b6;#7c3aed;#5b21b6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0e7490">
        <animate attributeName="stop-color" values="#0e7490;#0891b2;#0e7490" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurMe" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <style>
      .title { font-family: 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 58px; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font-family: 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 23px; fill: #ddd6fe; }
      .cursor { fill: #22d3ee; animation: blink 1.1s steps(1) infinite; }
      .line { stroke: #22d3ee; stroke-width: 3; stroke-linecap: round; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)" rx="16"/>
  <circle cx="90" cy="40" r="150" fill="url(#glowV)" filter="url(#blurMe)"/>
  <circle cx="1120" cy="220" r="150" fill="url(#glowC)" filter="url(#blurMe)"/>
  <rect x="2" y="2" width="1196" height="256" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.55"/>

  <rect x="-300" y="0" width="220" height="260" fill="#ffffff" opacity="0.05" transform="skewX(-20)">
    <animateTransform attributeName="transform" type="translate" values="-100 0; 1500 0" dur="6s" repeatCount="indefinite" additive="sum"/>
  </rect>

  <text x="600" y="128" text-anchor="middle" class="title">Karthik M<tspan class="cursor">|</tspan></text>
  <line x1="430" y1="158" x2="430" y2="158" class="line">
    <animate attributeName="x2" values="430;770;430" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <text x="600" y="200" text-anchor="middle" class="subtitle">Computer Science &amp; Engineering Student &#183; ML &amp; Web Development</text>
</svg>
